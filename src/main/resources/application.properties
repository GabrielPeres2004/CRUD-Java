spring.profiles.active=test
spring.application.name=crud-java

# CORS - origens permitidas (separadas por virgula)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://18.118.4.206:3000/}

# ===================================================
# MONITORAMENTO & ACTUATOR (Tarefa 23)
# ===================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ===================================================
# CONFIGURACAO DE LOGS (Tarefa 24)
# ===================================================
logging.level.root=INFO
logging.level.com.gabriel.crudjava=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/crud-java.log
